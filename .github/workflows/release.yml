name: Release

# A v* tag builds the plugin for each platform below and publishes the
# builds as a GitHub release: what `ws plugin add owner/repo` installs. A
# pull request that changes this file runs the builds without releasing,
# to try them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build each platform's
        run: |
          name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' plugin.toml)
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' plugin.toml)
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="$GITHUB_REF_NAME"
              # A release is of the version plugin.toml says it is.
              if [ "$tag" != "v$version" ]; then
                echo "the tag is $tag, and plugin.toml says version $version: tag it v$version, or change plugin.toml"
                exit 1
              fi
              ;;
            *) tag="dev-$(echo "$GITHUB_SHA" | cut -c1-7)" ;;
          esac
          mkdir dist
          # The framework is pure Go, so every platform's is built from here.
          # Each is its plugin.toml and what its command starts (ws-<name>).
          for platform in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os=${platform%/*}
            arch=${platform#*/}
            rm -rf out && mkdir out
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "out/ws-$name" .
            cp plugin.toml out/
            tar -czf "dist/${name}_${tag}_${os}_${arch}.tar.gz" -C out .
          done
          cd dist
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: builds
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: builds
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease *.tar.gz checksums.txt
