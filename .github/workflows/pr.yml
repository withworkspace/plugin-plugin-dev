name: PR Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # The app: its test, and that what's committed in ui/dist is what
      # its source builds. The plugin is built with what's committed.
      - run: npm ci
        working-directory: ui

      - run: npm test
        working-directory: ui

      - run: npm run build
        working-directory: ui

      - name: Check the built app is committed
        run: |
          if [ -n "$(git status --porcelain -- ui/dist)" ]; then
            echo "ui/dist isn't what ui/src builds: run npm run build in ui/, and commit ui/dist"
            git status --short -- ui/dist
            git diff -- ui/dist | head -50
            exit 1
          fi

      - run: go vet ./...

      # .golangci.yml says which, and how an error or a context let go
      # says why. Built with this repo's Go, which a release may be older than.
      - name: Lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go build -o /dev/null .

      - run: go test ./...
